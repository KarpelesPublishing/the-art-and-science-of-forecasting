[project]
name = "forecasting-book-companion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "statsmodels", "nbformat", "nbclient", "ipykernel", "pymupdf"]

[project.optional-dependencies]
models = ["lightgbm", "prophet", "torch", "transformers", "chronos-forecasting"]
best = ["statsforecast", "mlforecast", "hierarchicalforecast", "neuralforecast"]   # optional: used when present, named when absent
test = ["pytest"]

